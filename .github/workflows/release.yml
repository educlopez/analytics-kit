name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm; node 22 ships one that is too old.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm exec changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token on purpose: npm prefers a token whenever one is present,
          # and only falls back to OIDC trusted publishing when none is set. Every
          # @wingtics/* package trusts educlopez/wingtics + release.yml.
          NPM_CONFIG_PROVENANCE: true
      # GITHUB_TOKEN pushes do not trigger pull_request workflows, so the release
      # PR never gets lint · test · build unless we dispatch CI on its branch.
      - name: Trigger CI on release PR branch
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ask whether there is an open release PR, not whether the branch
          # exists. changesets leaves `changeset-release/main` behind after a
          # release merges, and a dispatch resolves `ci.yml` from the *ref* it
          # targets — so a leftover branch predating a change to ci.yml's
          # triggers answers `HTTP 422: Workflow does not have
          # 'workflow_dispatch' trigger` and reds the release job on every
          # later push to main. Measured, the first time this step ever ran.
          # Keying on the PR also stops us spending a CI run on a branch whose
          # release already shipped.
          #
          # `|| status=$?` is load-bearing: these steps run under `bash -e`.
          status=0
          pr=$(gh pr list --head changeset-release/main --state open --json number --jq '.[0].number // ""') || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::could not list release PRs ($status); refusing to assume there is none."
            exit 1
          fi
          if [ -n "$pr" ]; then
            echo "Dispatching CI for release PR #$pr."
            gh workflow run ci.yml --ref changeset-release/main
          else
            echo "No open release PR — nothing to dispatch."
          fi
