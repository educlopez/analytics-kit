name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @analytics-kit/demo build
        env:
          VITE_BASE: /analytics-kit/
          VITE_VERCEL_TOKEN: ${{ secrets.VITE_VERCEL_TOKEN }}
          VITE_VERCEL_PROJECT_ID: ${{ secrets.VITE_VERCEL_PROJECT_ID }}
          VITE_VERCEL_TEAM_ID: ${{ secrets.VITE_VERCEL_TEAM_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
